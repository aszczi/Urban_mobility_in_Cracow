name: Run notebook every 30 minutes

on:
  workflow_dispatch:
  schedule:
    - cron: "22,52 * * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: write

concurrency:
  group: run-notebook
  cancel-in-progress: false

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    env:
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib geopandas folium branca papermill ipykernel

      - name: Run notebook
        run: |
          mkdir -p output
          papermill Mobilnosc_miejska_w_Krakowie.ipynb output/Mobilnosc_miejska_w_Krakowie_output.ipynb



      - name: Commit updated traffic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic_history.csv
          git diff --staged --quiet || git commit -m "Update traffic history"
          git push

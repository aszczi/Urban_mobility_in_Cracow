name: Run notebook every 30 minutes

permissions:
  contents: write
  
on:
  workflow_dispatch:
  schedule:
    - cron: "0,30,33 * * * *"
      timezone: "Europe/Warsaw"

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill ipykernel

      - name: Run notebook
        run: |
          papermill notebooks/twoj_notatnik.ipynb output/output.ipynb

      - name: Commit updated traffic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic_history.csv
          git diff --staged --quiet || git commit -m "Update traffic history"
          git push

name: Run notebook every 30 minutes

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"
      timezone: "Europe/Warsaw"

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill ipykernel

      - name: Run notebook
        run: |
          papermill notebooks/twoj_notatnik.ipynb output/output.ipynb
